<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Windows 8</title>
</head>
<body>
    <header>
        <h1>Пуск</h1>
        <h3>User</h3>
    </header>
    <main>
        <div class="panel">
            <!--Red block-->
            <div class="block">
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="medium red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
            </div>

            <!--Orange block-->
            <div class="block">
                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="medium orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>

                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>

                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="medium orange"></div>
                <div class="medium"></div> <!--Invincable box-->

                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>
            </div>

            <!--Yellow block-->
            <div class="block">
                <div class="small yellow"></div>
                <div class="small yellow"></div>
                <div class="small yellow"></div>
                <div class="large"></div> <!--Invancable box-->

                <div class="small yellow"></div>
                <div class="small yellow"></div>
                <div class="small yellow"></div>
            </div>

            <!--Green block-->
            <div class="block">
                <div class="small green"></div>
                <div class="large green"></div>
                <div class="small green"></div>
                <div class="small green"></div>

                <div class="small green"></div>
                <div class="small green"></div>
                <div class="small green"></div>
            </div>

            <!--Blue block-->
            <div class="block">
                <div class="small blue"></div>
                <div class="small blue"></div>
                <div class="small blue"></div>
                <div class="large blue"></div>

                <div class="small blue"></div>
                <div class="small blue"></div>
                <div class="small blue"></div>

                <div class="medium blue"></div>
                <div class="small blue"></div>
                <div class="small blue"></div>
                <div class="small blue"></div>
                <div class="small"></div> <!--Invincable box-->

                <div class="small blue"></div>
                <div class="small blue"></div>
            </div>

            <!--Another blue block-->
            <div class="block">
                <div class="medium another-blue"></div>
                <div class="medium another-blue"></div>
                <div class="medium another-blue"></div>
                <div class="medium another-blue"></div>
                <div class="medium another-blue"></div>
            </div>

            <!--Purple block-->
            <div class="block">
                <div class="medium purple"></div>
                <div class="small purple"></div>
                <div class="small purple"></div>
                <div class="medium purple"></div>
                <div class="small purple"></div>

                <div class="small purple"></div>
                <div class="small purple"></div>
                <div class="small purple"></div>

                <div class="small purple"></div>
                <div class="small purple"></div>
                <div class="large"></div> <!--Invincable box-->
                <div class="medium"></div> <!--Invincable box-->

                <div class="small purple"></div>
            </div>

            <!--Another purple block-->
            <div class="block">
               <div class="medium another-purple"></div>
               <div class="medium another-purple"></div>
               <div class="large another-purple"></div>
               <div class="medium another-purple"></div>
            </div>

            <!--Pink block-->
            <div class="block">
                <div class="small pink"></div>
                <div class="small pink"></div>
                <div class="small pink"></div>
                <div class="small pink"></div>
                <div class="medium"></div>

                <div class="small pink"></div>
                <div class="small pink"></div>
                <div class="small pink"></div>
                <div class="small pink"></div>
            </div>
        </div>
    </main>
</body>
</html>
