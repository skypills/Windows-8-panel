<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Windows 8</title>
</head>
<body>
    <header>
        <h1>Пуск</h1>
        <h3>User</h3>
    </header>
    <main>
        <div class="panel">

            <!-- Pink Group -->
            <div class="tile-group">
                <div class="tile small bg-pink"></div>
                <div class="tile small bg-pink"></div>
                <div class="tile medium bg-pink"></div>
                <div class="tile small bg-pink"></div>
                <div class="tile small bg-pink"></div>
                <div class="tile small bg-pink"></div>
                <div class="tile small bg-pink"></div>
            </div>
        
            <!-- Orange Group -->
            <div class="tile-group font-orange">
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile medium bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
                <div class="tile small bg-orange"></div>
            </div>
        
            <!-- Yellow Group -->
            <div class="tile-group">
                <div class="tile small bg-yellow"></div>
                <div class="tile small bg-yellow"></div>
                <div class="tile small bg-yellow"></div>
                <div class="tile small bg-yellow"></div>
            </div>
        </div>
    </main>
</body>
</html>
