<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Windows 8</title>
</head>
<body>
    <header>
        <h1>Пуск</h1>
        <h3>User</h3>
    </header>
    <main>
        <div class="panel">
            <!--Red block-->
            <div class="block">
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
                <div class="small red"></div>
            </div>

            <!--Orange block-->
            <div class="block">
                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="medium orange"></div>
                <div class="small orange"></div>

                <div class="small orange"></div>
                <div class="small orange"></div>
                <div class="small orange"></div>

                <div class="small orange"></div>
                <div class="medium orange"></div>
                <div class="small orange"></div>
                <div class="medium"></div>

                <div class="small orange"></div>
                <div class="small orange"></div>
            </div>

            <!--Yellow block-->
            <div class="block">
                <div class="small yellow"></div>
                <div class="small yellow"></div>
                <div class="large"></div>

                <div class="small yellow"></div>
                <div class="small yellow"></div>
            </div>

            <!--Green block-->
            <div class="block">
                <div class="medium green"></div>
                <div class="medium green"></div>
                <div class="medium green"></div>
                <div class="medium green"></div>
            </div>

            <!--Blue block-->
            <div class="block">
                <div class="small blue"></div>
                <div class="large blue"></div>
                <div class="small blue"></div>

                <div class="medium blue"></div>
                <div class="small blue"></div>

                <div class="small blue"></div>
                <div class="medium blue"></div>
                <div class="small blue"></div>

                <div class="small blue"></div>
                <div class="small blue"></div>
            </div>
        </div>
    </main>
</body>
</html>
